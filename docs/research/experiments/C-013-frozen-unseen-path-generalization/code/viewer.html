<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="C-013 동결 adapter 미학습 경로 및 seed2 배경 비교"><title>C-013 실제 영상 검토</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--muted:#59564e;--card:#fff;--line:#d9d4c8;--request:#2a5ac8;--measured:#c8462a;--space:16px;--small:14px;--body:16px;--h1:24px;--h2:18px;--radius:4px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:var(--body)/1.5 system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere}main{max-width:1280px;margin:auto;padding:var(--space)}h1{font-size:var(--h1)}h2{font-size:var(--h2)}nav,.controls{display:flex;flex-wrap:wrap;gap:var(--space);align-items:center;margin-bottom:var(--space)}button{font:inherit;padding:8px 16px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}button:hover,button[aria-selected=true]{border-color:var(--request);color:var(--request)}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--request);outline-offset:4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space)}article{padding:var(--space);background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}video,img,svg{width:100%;height:auto;aspect-ratio:416/240}small,.note{color:var(--muted);font-size:var(--small)}a{color:var(--request)}input{max-width:100%}.error{color:var(--measured)}[hidden]{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}}.legend{font-size:var(--small)}
</style></head><body><main>
<h1>C-013 미학습 경로 · 실제 영상</h1><p id="summary"></p><p class="note">원 MP4는 생성 byte 그대로입니다. 아래 PNG는 동일 frame-index이며, 시트·평면도는 평가 파생물입니다. 정답 renderer는 모델 출력이 아닙니다. temporal=UNVERIFIED · 같은 세션의 정적 검토는 독립 human 평가가 아닙니다.</p>
<nav role="tablist" aria-label="비교 선택"><button role="tab" data-tab="new" aria-selected="true">새 경로 네 개</button><button role="tab" data-tab="parent" aria-selected="false">부모 학습 A/B</button><button role="tab" data-tab="seed2" aria-selected="false">seed2 BASE / ON</button></nav>
<div class="controls"><label for="frame">공통 frame-index <output id="index">16</output> / 32</label><input id="frame" type="range" min="0" max="32" step="1" value="16"><button id="play">현재 탭 함께 재생</button><button id="pause">일시정지</button></div>
<section id="new" class="grid" aria-label="새 경로"></section><section id="parent" class="grid" aria-label="부모 경로" hidden></section><section id="seed2" class="grid" aria-label="seed2 배경 대조" hidden></section>
<p><a href="RESULTS.md">결과 원문</a> · <a href="METRICS.json">전33프레임 측정</a> · <a href="METHOD_AND_LESSON_KO.md">한국어 해설</a></p>
</main><script>
const data=/*DATA*/{};
const frame=document.querySelector('#frame');
const line=points=>points.filter(p=>p!==null).map(p=>p.join(',')).join(' ');
function plot(entry){return `<svg viewBox="0 0 416 240" aria-label="요청 및 측정 경로" role="img"><rect width="416" height="240" fill="var(--bg)"/><path d="M0 120H416" stroke="var(--line)"/><polyline points="${line(entry.target||[])}" fill="none" stroke="var(--request)" stroke-width="2"/>${entry.centers.filter(p=>p!==null).map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--measured)"/>`).join('')}</svg>`}
for(const entry of data.entries){const card=document.createElement('article');card.innerHTML=`<h2>${entry.id}</h2><p class="note">${entry.label}</p><video controls muted playsinline preload="metadata" width="416" height="240" src="media/${entry.id}.mp4"></video><p class="error" hidden>영상 읽기 실패. media 폴더가 함께 추출되었는지 확인하세요.</p><img class="frame" data-run="${entry.id}" width="416" height="240" src="frames/${entry.id}/016.png" alt="${entry.id} frame 16"><p>${entry.description}</p><div class="legend">파랑: 요청 좌표 · 빨강 점: 검출된 단일 객체 (누락/중복은 표시하지 않음)</div>${plot(entry)}<a href="sheets/${entry.id}.png">고정 9시점 시트 (파생물)</a>${entry.oracle?` · <a href="oracle/${entry.oracle}/016.png">정답 renderer t16 (생성 아님)</a>`:''}`;card.querySelector('video').addEventListener('loadedmetadata',()=>{card.querySelector('video').currentTime=Number(frame.value)/16});card.querySelector('video').addEventListener('error',()=>card.querySelector('.error').hidden=false);document.getElementById(entry.tab).append(card)}
document.querySelector('#summary').textContent=data.summary;
function seek(){const t=Number(frame.value);document.querySelector('#index').value=String(t);document.querySelectorAll('video').forEach(v=>{v.pause();v.currentTime=t/16});document.querySelectorAll('img.frame').forEach(img=>{img.src=`frames/${img.dataset.run}/${String(t).padStart(3,'0')}.png`;img.alt=`${img.dataset.run} frame ${t}`})}
frame.addEventListener('input',seek);
document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('video').forEach(v=>v.pause());document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));document.querySelectorAll('section.grid').forEach(s=>s.hidden=s.id!==button.dataset.tab);seek()}));
document.querySelector('#play').onclick=()=>document.querySelectorAll('section:not([hidden]) video').forEach(v=>v.play().catch(()=>{v.parentElement.querySelector('.error').hidden=false}));
document.querySelector('#pause').onclick=()=>document.querySelectorAll('video').forEach(v=>v.pause());
</script></body></html>
