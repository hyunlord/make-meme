<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="원본, 기준선, 생성 영상과 앵커를 함께 재생하는 오프라인 연구 검토 페이지"><title>영상 검토</title>
<style>
:root{--bg:#fff;--fg:#171717;--muted:#555;--line:#ddd;--empty:#f4f4f4;--focus:#005ea8;--s:8px;--body:16px;--caption:14px;--heading:24px;--column:256px}
*{box-sizing:border-box}body{margin:calc(var(--s)*2);font:var(--body)/1.5 system-ui,sans-serif;color:var(--fg);background:var(--bg);word-break:keep-all}h1{font-size:var(--heading)}h2{font-size:var(--body)}h1,h2,p{margin:0 0 calc(var(--s)*2)}button,select,input{font:inherit}button,select{padding:var(--s);background:var(--bg);border:1px solid var(--line);color:var(--fg)}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s);margin-bottom:var(--s)}.scroll{overflow-x:auto;margin-bottom:calc(var(--s)*3)}.columns,.anchors{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(var(--column),1fr);gap:var(--s)}figure{margin:0;border:1px solid var(--line);padding:var(--s)}figcaption{font-size:var(--caption);min-height:3em}video,.media img,.empty{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:var(--empty)}.empty{display:flex;align-items:center;justify-content:center;padding:var(--s);text-align:center}.media-pair{display:flex;gap:var(--s)}.media-part{flex:1;min-width:0}.media-part[hidden]{display:none}.media-label{font-size:var(--caption);min-height:3em}.status{font-size:var(--caption);color:var(--muted)}#position{flex:1;min-width:160px}#keyframes{display:flex;gap:var(--s);flex-wrap:wrap;margin-bottom:var(--s)}#anchor-now{max-width:512px;width:100%;aspect-ratio:16/9;object-fit:contain}table{border-collapse:collapse;width:100%;font-size:var(--caption)}td,th{padding:var(--s);border:1px solid var(--line);text-align:left;vertical-align:top}a{color:var(--focus)}footer{margin-top:calc(var(--s)*3)}#errors{color:#a00000}.anchors img{width:100%;aspect-ratio:16/9;object-fit:contain}
</style></head><body><header><h1 id="title">영상 검토</h1><p id="stage"></p><p>품질 판정: HUMAN_REVIEW_PENDING. IoU와 bbox 비율은 동작·직립의 대리 지표이며 변형의 우열을 정하지 않습니다.</p></header>
<main><div class="controls"><button id="play">재생</button><button id="pause">일시정지</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button><label>속도 <select id="rate"><option value="1">1×</option><option value="0.5">0.5×</option></select></label><label>영상 <select id="mode"><option value="both">RAW + POST 나란히</option><option value="raw">RAW 원본 생성</option><option value="post">POST 배경 합성 파생본</option></select></label></div>
<div class="controls"><label for="position">프레임</label><input id="position" type="range" min="0" value="0" step="1"><output id="time"></output></div><div id="keyframes" aria-label="키프레임 이동"></div><p id="errors" role="status"></p>
<div class="scroll"><div id="columns" class="columns"></div></div>
<section><h2>현재 시점의 가장 가까운 앵커</h2><p id="anchor-label"></p><img id="anchor-now" alt="현재 시점에 가장 가까운 수용 앵커" hidden></section>
<section><h2>키프레임 앵커 시트</h2><div class="scroll"><div id="anchors" class="anchors"></div></div></section>
<section><h2>자동 측정 (참고값)</h2><div class="scroll"><table><thead><tr><th>출력</th><th>기술 상태</th><th>측정</th></tr></thead><tbody id="metrics"></tbody></table></div></section></main><footer id="documents"></footer>
<script id="review-data" type="application/json">{}</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#review-data').textContent);const $=s=>document.querySelector(s);const videos=[];let playing=false,raf=0,currentFrame=0,mode=data.clips.some(c=>c.post)?'both':'raw';
$('#title').textContent=data.title;document.title=data.title;$('#stage').textContent=data.stage;$('#position').max=data.frames-1;$('#mode').value=mode;
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function chooseAnchor(frame){const available=data.anchors.filter(a=>a.src&&a.accepted);if(!available.length){$('#anchor-now').hidden=true;$('#anchor-label').textContent='수용 앵커 없음';return}const a=available.reduce((x,y)=>Math.abs(y.frame-frame)<Math.abs(x.frame-frame)?y:x);$('#anchor-now').src=a.src;$('#anchor-now').hidden=false;$('#anchor-label').textContent=`앵커 프레임 ${a.frame} · 현재 ${frame} · 차이 ${frame-a.frame}`}
function display(frame){currentFrame=Math.max(0,Math.min(data.frames-1,frame));$('#position').value=currentFrame;$('#time').textContent=`${currentFrame} / ${data.frames-1} (${(currentFrame/data.fps).toFixed(3)}초)`;chooseAnchor(currentFrame)}
function pause(){playing=false;cancelAnimationFrame(raf);videos.forEach(({video})=>video.pause())}
function seek(frame){pause();display(frame);videos.forEach(({video})=>{if(video.readyState>0)video.currentTime=Math.min(currentFrame/data.fps,Math.max(0,video.duration-1/data.fps))})}
function tick(){if(!playing)return;const lead=videos.find(({video})=>!video.hidden&&video.readyState>1);if(lead){display(Math.round(lead.video.currentTime*data.fps));for(const {video} of videos){if(video!==lead.video&&!video.hidden&&video.readyState>1&&Math.abs(video.currentTime-lead.video.currentTime)>1/data.fps)video.currentTime=lead.video.currentTime}if(lead.video.ended){pause();return}}raf=requestAnimationFrame(tick)}
function metricLines(m){
const number=(v,scale=1,digits=2)=>typeof v==='number'&&Number.isFinite(v)?(v*scale).toFixed(digits):'NOT_MEASURED';
const lines=[];
if(m.roles){for(const [role,r]of Object.entries(m.roles))lines.push(`${role}: 직립 하한 ${number(r.upright_lower_bound_fraction,100)}% · 중심 거리 ${number(r.center_distance_width_percent)}%W · IoU ${number(r.iou_all_frame,1,3)}`);lines.push(`개체 수 일치 ${number(m.count_matches_fraction,100)}% · 반대 대응 대리값 ${number(m.geometric_opposition_frames,1,0)}프레임`);lines.push('IoU·직립·반대 대응은 대리 지표이며 동작/정체성 합격 판정이 아닙니다.');}
if(m.background)lines.push(`배경 연속 차이 비율 RAW/원본 ${number(m.background.raw_over_source)} · POST/원본 ${number(m.background.post_over_source)} (합성 PNG 기준)`);
if(m.cost){lines.push(`생성 ${number(m.cost.elapsed_seconds,1,1)}초 · RSS ${number(m.cost.peak_rss_bytes_receipt,1/1073741824)}GiB · cgroup ${number(m.cost.cgroup_peak_bytes_sampled,1/1073741824)}GiB · ${number(m.cost.scheduler_steps_completed,1,0)} steps`);}
if(!lines.length)lines.push('NOT_MEASURED');return lines;
}
for(const clip of data.clips){const fig=element('figure');fig.append(element('figcaption',clip.label));const media=element('div');media.className='media';const status=element('p',clip.status);status.className='status';if(clip.raw){media.classList.add('media-pair');for(const role of ['raw','post']){if(!clip[role])continue;const part=element('div');part.className='media-part';if(clip.generated){const label=element('div',role==='raw'?'RAW 원본 생성':'POST 배경 합성 파생본');label.className='media-label';part.append(label)}const video=element('video');video.src=clip[role];video.muted=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label',`${clip.label} ${role}`);video.addEventListener('error',()=>{status.textContent=`MEDIA_ERROR: ${clip.label} ${role}`});part.append(video);media.append(part);videos.push({video,clip,status,role,part});}}else{const empty=element('div',`${clip.status}: ${clip.reason||'영상 없음'}`);empty.className='empty';media.append(empty)}fig.append(media,status);$('#columns').append(fig);const row=element('tr');row.append(element('th',clip.label),element('td',clip.status));const cell=element('td');if(clip.metrics){for(const line of metricLines(clip.metrics))cell.append(element('div',line))}else cell.textContent=clip.generated?'NOT_MEASURED':'REFERENCE_ONLY · 이번 실험의 신규 SAM 측정 대상 아님';row.append(cell);$('#metrics').append(row)}
for(const a of data.anchors){const b=element('button',String(a.frame));b.addEventListener('click',()=>seek(a.frame));$('#keyframes').append(b);const f=element('figure');f.append(element('figcaption',`프레임 ${a.frame} · ${a.status}`));if(a.src){const im=element('img');im.src=a.src;im.alt=`프레임 ${a.frame} 앵커`;f.append(im)}else{const p=element('div','NOT_GENERATED');p.className='empty';f.append(p)}$('#anchors').append(f)}
for(const [label,path]of Object.entries(data.documents)){const a=element('a',label);a.href=path;$('#documents').append(a,document.createTextNode(' · '))}
$('#play').onclick=async()=>{pause();if(!videos.length)return;playing=true;for(const {video}of videos){if(video.hidden)continue;try{await video.play()}catch(e){$('#errors').textContent=`재생 불가: ${e.message}`}}tick()};$('#pause').onclick=pause;$('#prev').onclick=()=>seek(currentFrame-1);$('#next').onclick=()=>seek(currentFrame+1);$('#position').oninput=e=>seek(Number(e.target.value));$('#rate').onchange=e=>videos.forEach(({video})=>video.playbackRate=Number(e.target.value));function setMode(){pause();mode=$('#mode').value;for(const {video,clip,status,role,part}of videos){const shown=!clip.generated||mode==='both'||mode===role;video.hidden=!shown;part.hidden=!shown;status.textContent=clip.generated&&mode==='post'&&!clip.post?'POST_NOT_AVAILABLE':clip.status}}$('#mode').onchange=setMode;setMode();display(0);
</script></body></html>
