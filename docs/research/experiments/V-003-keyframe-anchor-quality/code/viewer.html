<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="원본, 기준선, 생성 영상과 앵커를 함께 재생하는 오프라인 연구 검토 페이지"><title>영상 검토</title>
<style>
:root{--bg:#fff;--fg:#171717;--muted:#555;--line:#ddd;--empty:#f4f4f4;--focus:#005ea8;--s:8px;--body:16px;--caption:14px;--heading:24px;--column:256px}
*{box-sizing:border-box}body{margin:calc(var(--s)*2);font:var(--body)/1.5 system-ui,sans-serif;color:var(--fg);background:var(--bg);word-break:keep-all}h1{font-size:var(--heading)}h2{font-size:var(--body)}h1,h2,p{margin:0 0 calc(var(--s)*2)}button,select,input{font:inherit}button,select{padding:var(--s);background:var(--bg);border:1px solid var(--line);color:var(--fg)}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s);margin-bottom:var(--s)}.scroll{overflow-x:auto;margin-bottom:calc(var(--s)*3)}.columns,.anchors{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(var(--column),1fr);gap:var(--s)}figure{margin:0;border:1px solid var(--line);padding:var(--s)}figcaption{font-size:var(--caption);min-height:3em}video,.media img,.empty{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:var(--empty)}.empty{display:flex;align-items:center;justify-content:center;padding:var(--s);text-align:center}.status{font-size:var(--caption);color:var(--muted)}#position{flex:1;min-width:160px}#keyframes{display:flex;gap:var(--s);flex-wrap:wrap;margin-bottom:var(--s)}#anchor-now{max-width:512px;width:100%;aspect-ratio:16/9;object-fit:contain}table{border-collapse:collapse;width:100%;font-size:var(--caption)}td,th{padding:var(--s);border:1px solid var(--line);text-align:left;vertical-align:top}a{color:var(--focus)}footer{margin-top:calc(var(--s)*3)}#errors{color:#a00000}.anchors img{width:100%;aspect-ratio:16/9;object-fit:contain}
</style></head><body><header><h1 id="title">영상 검토</h1><p id="stage"></p><p>품질 판정: HUMAN_REVIEW_PENDING. IoU와 bbox 비율은 동작·직립의 대리 지표이며 변형의 우열을 정하지 않습니다.</p></header>
<main><div class="controls"><button id="play">재생</button><button id="pause">일시정지</button><button id="prev">이전 프레임</button><button id="next">다음 프레임</button><label>속도 <select id="rate"><option value="1">1×</option><option value="0.5">0.5×</option></select></label><label>영상 <select id="mode"><option value="raw">RAW 원본 생성</option><option value="post">POST 배경 합성 파생본</option></select></label></div>
<div class="controls"><label for="position">프레임</label><input id="position" type="range" min="0" value="0" step="1"><output id="time"></output></div><div id="keyframes" aria-label="키프레임 이동"></div><p id="errors" role="status"></p>
<div class="scroll"><div id="columns" class="columns"></div></div>
<section><h2>현재 시점의 가장 가까운 앵커</h2><p id="anchor-label"></p><img id="anchor-now" alt="현재 시점에 가장 가까운 수용 앵커" hidden></section>
<section><h2>키프레임 앵커 시트</h2><div class="scroll"><div id="anchors" class="anchors"></div></div></section>
<section><h2>자동 측정 (참고값)</h2><div class="scroll"><table><thead><tr><th>출력</th><th>기술 상태</th><th>측정</th></tr></thead><tbody id="metrics"></tbody></table></div></section></main><footer id="documents"></footer>
<script id="review-data" type="application/json">{}</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#review-data').textContent);const $=s=>document.querySelector(s);const videos=[];let playing=false,raf=0,currentFrame=0,mode='raw';
$('#title').textContent=data.title;document.title=data.title;$('#stage').textContent=data.stage;$('#position').max=data.frames-1;
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function chooseAnchor(frame){const available=data.anchors.filter(a=>a.src&&a.accepted);if(!available.length){$('#anchor-now').hidden=true;$('#anchor-label').textContent='수용 앵커 없음';return}const a=available.reduce((x,y)=>Math.abs(y.frame-frame)<Math.abs(x.frame-frame)?y:x);$('#anchor-now').src=a.src;$('#anchor-now').hidden=false;$('#anchor-label').textContent=`앵커 프레임 ${a.frame} · 현재 ${frame} · 차이 ${frame-a.frame}`}
function display(frame){currentFrame=Math.max(0,Math.min(data.frames-1,frame));$('#position').value=currentFrame;$('#time').textContent=`${currentFrame} / ${data.frames-1} (${(currentFrame/data.fps).toFixed(3)}초)`;chooseAnchor(currentFrame)}
function pause(){playing=false;cancelAnimationFrame(raf);videos.forEach(({video})=>video.pause())}
function seek(frame){pause();display(frame);videos.forEach(({video})=>{if(video.readyState>0)video.currentTime=Math.min(currentFrame/data.fps,Math.max(0,video.duration-1/data.fps))})}
function tick(){if(!playing)return;const lead=videos.find(({video})=>video.readyState>1);if(lead){display(Math.round(lead.video.currentTime*data.fps));for(const {video} of videos){if(video!==lead.video&&video.readyState>1&&Math.abs(video.currentTime-lead.video.currentTime)>1/data.fps)video.currentTime=lead.video.currentTime}if(lead.video.ended){pause();return}}raf=requestAnimationFrame(tick)}
for(const clip of data.clips){const fig=element('figure');fig.append(element('figcaption',clip.label));const media=element('div');media.className='media';const status=element('p',clip.status);status.className='status';if(clip.raw){const video=element('video');video.src=clip.raw;video.muted=true;video.playsInline=true;video.preload='metadata';video.setAttribute('aria-label',clip.label);video.addEventListener('error',()=>{status.textContent=`MEDIA_ERROR: ${clip.label}`});media.append(video);videos.push({video,clip,status});}else{const empty=element('div',`${clip.status}: ${clip.reason||'영상 없음'}`);empty.className='empty';media.append(empty)}fig.append(media,status);$('#columns').append(fig);const row=element('tr');row.append(element('th',clip.label),element('td',clip.status));const cell=element('td');if(clip.metrics){for(const [key,value]of Object.entries(clip.metrics))cell.append(element('div',`${key}: ${typeof value==='object'?JSON.stringify(value):value}`))}else cell.textContent='NOT_MEASURED';row.append(cell);$('#metrics').append(row)}
for(const a of data.anchors){const b=element('button',String(a.frame));b.addEventListener('click',()=>seek(a.frame));$('#keyframes').append(b);const f=element('figure');f.append(element('figcaption',`프레임 ${a.frame} · ${a.status}`));if(a.src){const im=element('img');im.src=a.src;im.alt=`프레임 ${a.frame} 앵커`;f.append(im)}else{const p=element('div','NOT_GENERATED');p.className='empty';f.append(p)}$('#anchors').append(f)}
for(const [label,path]of Object.entries(data.documents)){const a=element('a',label);a.href=path;$('#documents').append(a,document.createTextNode(' · '))}
$('#play').onclick=async()=>{pause();if(!videos.length)return;playing=true;for(const {video}of videos){if(video.hidden)continue;try{await video.play()}catch(e){$('#errors').textContent=`재생 불가: ${e.message}`}}tick()};$('#pause').onclick=pause;$('#prev').onclick=()=>seek(currentFrame-1);$('#next').onclick=()=>seek(currentFrame+1);$('#position').oninput=e=>seek(Number(e.target.value));$('#rate').onchange=e=>videos.forEach(({video})=>video.playbackRate=Number(e.target.value));$('#mode').onchange=e=>{pause();mode=e.target.value;for(const {video,clip,status}of videos){const src=mode==='post'&&clip.generated?clip.post:clip.raw;if(!src){video.hidden=true;status.textContent='POST_NOT_AVAILABLE';continue}video.hidden=false;status.textContent=mode==='post'&&clip.generated?'POST · CPU 배경 합성 파생본':clip.status;if(video.getAttribute('src')!==src){video.src=src;video.addEventListener('loadedmetadata',()=>{video.currentTime=currentFrame/data.fps;video.playbackRate=Number($('#rate').value)},{once:true})}}};display(0);
</script></body></html>
