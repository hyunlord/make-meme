[project]
name = "make-meme-mcp"
version = "0.1.0"
description = "MCP server for turning a video + photos into a subject-swapped meme video"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=1.2.0,<2",
  "httpx>=0.27",
  "websockets>=12.0",
  "pyyaml>=6.0",
  "pillow>=10.4",
  "yt-dlp>=2024.8.6",
  "ddgs>=9.0",
  "curl_cffi>=0.13",
]

[project.scripts]
make-meme-mcp = "make_meme.server:main"
make-meme = "make_meme.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/make_meme"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]  # notebook cells use !shell magics
